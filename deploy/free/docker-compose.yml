# Self-hosted BAGER SITE LINK: no paid software subscriptions.
# Run in deploy/free with: docker compose --env-file .env up -d --build
services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://bager:${POSTGRES_PASSWORD}@db:5432/bager
      BAGER_ADMIN_PASSWORD: ${BAGER_ADMIN_PASSWORD}
      COOKIE_SECURE: "1"
      SESSION_HOURS: "14"
      PORT: "10000"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "10000"
    networks:
      - private
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bager -d bager"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      BAGER_DOMAIN: ${BAGER_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - private
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
networks:
  private:
