name: bager-site-link
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bager
      POSTGRES_USER: bager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bager -d bager"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://bager:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/bager
      BAGER_ADMIN_PASSWORD: ${BAGER_ADMIN_PASSWORD:?Set BAGER_ADMIN_PASSWORD in .env}
      COOKIE_SECURE: "1"
      SESSION_HOURS: "14"
      PORT: "10000"
    networks: [private]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN to your DNS hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [private]
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
networks:
  private:
