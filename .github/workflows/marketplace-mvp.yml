name: Marketplace MVP checks
on:
  push:
    branches: [feature/marketplace-mvp-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m compileall -q app tests
      - name: Isolated marketplace tests
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/marketplace_test.sqlite3
          BAGER_ADMIN_PASSWORD: ci-test-only
        run: python -m pytest -q tests/test_marketplace.py
