name: Marketplace MVP checks
on:
  push:
    branches: [feature/marketplace-mvp-release]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m compileall -q app tests
      - name: Isolated marketplace tests
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/marketplace_test.sqlite3
          BAGER_ADMIN_PASSWORD: ci-test-only
        run: python -m pytest -q tests/test_marketplace.py
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bager_test
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_DB: bager_marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bager_test -d bager_marketplace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest httpx
      - name: Marketplace API tests against PostgreSQL 17
        env:
          DATABASE_URL: postgresql+psycopg://bager_test:ci-only-postgres-password@localhost:5432/bager_marketplace_test
          BAGER_ADMIN_PASSWORD: ci-test-only
          COOKIE_SECURE: '0'
        run: python -m pytest -q tests/test_marketplace.py
