name: GPS staging validation
on:
  push:
    branches:
      - staging/gps-v034-validation
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *' # Daily UTC, staging only
permissions:
  contents: read
jobs:
  gps-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile Python application and tests
        run: python -m compileall -q app tests
      - name: Parse all deployed JavaScript files
        run: |
          node --check static/app.js
          node --check static/field-command.js
          node --check static/gps-v03.mjs
          node --check static/sw.js
      - name: JavaScript GPS regression tests
        run: find tests -type f -name '*.test.mjs' -print0 | xargs -0 -r node --test
      - name: Isolated API regression tests
        run: python tests/run_isolated.py
      - name: Validate free-hosting configuration (no credentials or deployment)
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-secret
          BAGER_ADMIN_PASSWORD: ci-placeholder-not-a-secret
          BAGER_DOMAIN: example.invalid
        run: |
          docker compose -f deploy/free/docker-compose.yml config --quiet
          sh -n deploy/free/backup.sh
          sh -n deploy/free/restore.sh
          python - <<'PY'
          from pathlib import Path
          compose = Path("deploy/free/docker-compose.yml").read_text()
          assert 'postgres_data:' in compose, "Postgres persistence missing"
          assert '5432:5432' not in compose, "Database must not be published"
          assert 'COOKIE_SECURE: "1"' in compose, "HTTPS cookie protection missing"
          for secret in ('POSTGRES_PASSWORD', 'BAGER_ADMIN_PASSWORD', 'BAGER_DOMAIN'):
              assert '${'+secret+':?' in compose, f"Fail-closed check missing: {secret}"
          print("Free-hosting static guardrails OK")
          PY
      - name: Record exact tested revision
        if: always()
        run: |
          echo '### BAGER staging validation' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Check individual steps for pass/fail; do not infer success from this summary.' >> "$GITHUB_STEP_SUMMARY"
