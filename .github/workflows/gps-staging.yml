name: GPS staging validation
on:
  push:
    branches:
      - staging/gps-v034-validation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gps-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: JavaScript GPS regression tests
        run: node --test tests/gps-event-id.test.mjs tests/gps-hardening.test.mjs
      - name: Isolated API regression tests
        run: python tests/run_isolated.py
