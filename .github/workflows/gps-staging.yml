name: GPS staging validation
on:
  push:
    branches:
      - staging/gps-v034-validation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gps-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Parse all deployed JavaScript files
        run: |
          node --check static/app.js
          node --check static/field-command.js
          node --check static/gps-v03.mjs
          node --check static/sw.js
      - name: JavaScript GPS regression tests
        run: node --test tests/*.test.mjs tests/gps/*.test.mjs
      - name: Isolated API regression tests
        run: python tests/run_isolated.py
