name: GPS staging validation
on:
  push:
    branches:
      - staging/gps-v034-validation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gps-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile Python application and tests
        run: python -m compileall -q app tests
      - name: Parse all deployed JavaScript files
        run: |
          node --check static/app.js
          node --check static/field-command.js
          node --check static/gps-v03.mjs
          node --check static/sw.js
      - name: JavaScript GPS regression tests
        run: find tests -type f -name '*.test.mjs' -print0 | xargs -0 -r node --test
      - name: Isolated API regression tests
        run: python tests/run_isolated.py
      - name: Record exact tested revision
        if: always()
        run: |
          echo '### BAGER staging validation' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Check individual steps for pass/fail; do not infer success from this summary.' >> "$GITHUB_STEP_SUMMARY"
